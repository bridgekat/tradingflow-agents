[package]
name = "score"
version = "0.1.0"
edition = "2024"

# No `pyo3` and no `python` feature on `tradingflow`: the scorer must not be
# able to execute a submission's Python operators even by accident. It reads
# a weights CSV and market data, and nothing else.
[dependencies]
tradingflow = { path = "../../tradingflow/crates/tradingflow" }
arrow = "59.1.0"
parquet = { version = "59.1.0", features = ["arrow", "zstd"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }
clap = { version = "4.6.5", features = ["derive"] }
chrono = "0.4.42"
indicatif = "0.18.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
