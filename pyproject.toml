[project]
name = "tradingflow-agents"
version = "0.1.0"
description = "Multi-objective autoresearch over trading strategies on TradingFlow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "cvxpy",
    "scs",
    "lightgbm>=4.7.0",
]

# Dependencies only: the agents are Claude Code sessions driven by the
# instruction files under `autoresearch/`, not an installed package.
[tool.uv]
package = false
