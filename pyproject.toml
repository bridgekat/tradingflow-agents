[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradingflow-agents"
version = "0.1.0"
description = "LLM agents for experimenting with trading strategies on TradingFlow (OpenAI Agents SDK + DeepSeek)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.18",
    "python-dotenv>=1.0",
    "ripgrep>=14",
    "httpx>=0.27",
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "cvxpy",
    "scs",
]

# One executable per agent.
[project.scripts]
general-research = "tradingflow_agents.general_research.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tradingflow_agents"]

[tool.black]
line-length = 120
