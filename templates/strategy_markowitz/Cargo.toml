[package]
name = "strategy_markowitz"
version = "0.1.0"
edition = "2024"

# Standalone package (not a member of the tradingflow workspace).
[workspace]

[dependencies]
tradingflow = { path = "../../tradingflow/crates/tradingflow", features = ["python"] }
# Match the arrow/parquet versions used by tradingflow.
arrow = "59.1.0"
parquet = { version = "59.1.0", features = ["arrow", "zstd"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }
clap = { version = "4.6.5", features = ["derive"] }
chrono = "0.4.42"
indicatif = "0.18.6"
# For building the Python operators' keyword arguments (`py_params`); already
# in the tree via `tradingflow`'s `python` feature.
pyo3 = "0.29.0"
